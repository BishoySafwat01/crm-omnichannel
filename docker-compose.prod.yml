services:
  # 1. PostgreSQL Database Container
  postgres_db:
    image: postgres:16-alpine
    container_name: crm_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_omnichannel}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crm_omnichannel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      crm-network:
        aliases:
          - db
          - postgres_db

  # 2. Redis Cache Container
  redis_prod:
    image: redis:7-alpine
    container_name: crm_prod_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      crm-network:
        aliases:
          - redis
          - redis_prod

  # 3. FastAPI Backend Application Container
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_prod_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_omnichannel}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres_db:5432/${POSTGRES_DB:-crm_omnichannel}
      REDIS_HOST: redis_prod
      REDIS_PORT: 6379
      REDIS_URL: redis://redis_prod:6379/0
      SECRET_KEY: ${SECRET_KEY:-4d71c9b69a027039bb284cdb829124970205d60a4eb031a566285cbbab984925}
      META_PAGE_ID: ${META_PAGE_ID}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      ENABLE_DIRECT_META: ${ENABLE_DIRECT_META:-false}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-BEON}
      BEON_API_KEY: ${BEON_API_KEY:-ZUiczQBL4Ymh7E6qjkNS}
      BEON_API_BASE_URL: ${BEON_API_BASE_URL:-https://v3.api.beon.chat/api}
      BEON_WEBHOOK_SECRET: ${BEON_WEBHOOK_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - crm-network

  # 4. React Frontend Built Asset Container
  frontend_build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: crm_prod_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - crm-network

  # 5. Production Nginx Reverse Proxy Container (Public Entrypoint)
  nginx_proxy:
    image: nginx:alpine
    container_name: crm_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend_api:
        condition: service_healthy
      frontend_build:
        condition: service_healthy
    networks:
      - crm-network

volumes:
  postgres_prod_data:
  backend_uploads:

networks:
  crm-network:
    driver: bridge

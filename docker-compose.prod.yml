version: "3.8"

services:
  # 1. PostgreSQL Database Container
  postgres_db:
    image: postgres:16-alpine
    container_name: crm_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_omnichannel}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crm_omnichannel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # 2. Redis Cache Container
  redis_prod:
    image: redis:7-alpine
    container_name: crm_prod_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # 3. FastAPI Backend Application Container
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_prod_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_omnichannel}
      REDIS_HOST: redis_prod
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY}
      META_PAGE_ID: ${META_PAGE_ID}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      RESPOND_IO_API_TOKEN: ${RESPOND_IO_API_TOKEN}
      RESPOND_IO_WEBHOOK_SECRET: ${RESPOND_IO_WEBHOOK_SECRET}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    networks:
      - crm-network

  # 4. React Frontend Built Asset Container
  frontend_build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: crm_prod_frontend
    restart: always
    networks:
      - crm-network

  # 5. Production Nginx Reverse Proxy Container (Public Entrypoint)
  nginx_proxy:
    image: nginx:alpine
    container_name: crm_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend_api
      - frontend_build
    networks:
      - crm-network

volumes:
  postgres_prod_data:
  backend_uploads:

networks:
  crm-network:
    driver: bridge
